name: CI

# Cost control:
# - No automatic CI on push or pull_request.
# - No macOS runner job.
# - No Codecov upload.
# - Run manually only when explicitly requested.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Manual Test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: |
          go fmt ./...
          go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o onwatch .
