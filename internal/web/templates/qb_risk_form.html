{{define "content"}}
<div class="app">
    <main id="main-content" class="main-content">
        <div class="welcome-banner">
            <h1 class="welcome-title">{{if .RiskNote}}编辑风险备注{{else}}新增风险备注{{end}}</h1>
        </div>
        <section class="insights-panel" style="max-width:640px">
            <form id="riskForm" class="qb-form">
                {{if .RiskNote}}<input type="hidden" name="id" value="{{.RiskNote.ID}}">{{end}}
                <input type="hidden" name="target_type" value="{{.TargetType}}">
                <input type="hidden" name="target_id" value="{{.TargetID}}">
                <div class="form-group">
                    <label class="form-label" for="level">等级 *</label>
                    <select class="form-input" id="level" name="level" required>
                        <option value="low" {{if and .RiskNote (eq .RiskNote.Level "low")}}selected{{end}}>低</option>
                        <option value="medium" {{if and .RiskNote (eq .RiskNote.Level "medium")}}selected{{end}}>中</option>
                        <option value="high" {{if and .RiskNote (eq .RiskNote.Level "high")}}selected{{end}}>高</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="title">标题 *</label>
                    <input class="form-input" type="text" id="title" name="title" value="{{if .RiskNote}}{{.RiskNote.Title}}{{end}}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="content">内容</label>
                    <textarea class="form-input" id="content" name="content" rows="4">{{if .RiskNote}}{{.RiskNote.Content}}{{end}}</textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="source">来源</label>
                    <input class="form-input" type="text" id="source" name="source" value="{{if .RiskNote}}{{.RiskNote.Source}}{{end}}" placeholder="manual">
                </div>
                <div class="form-group">
                    <label class="form-label" for="expires_at">到期时间</label>
                    <input class="form-input" type="text" id="expires_at" name="expires_at" value="{{if .RiskNote}}{{.RiskNote.ExpiresAt}}{{end}}" placeholder="2025-12-31T23:59:59Z">
                </div>
                <div class="form-group">
                    <label class="form-label" for="resolved_at">解决时间</label>
                    <input class="form-input" type="datetime-local" id="resolved_at" name="resolved_at" value="{{if .RiskNote}}{{.RiskNote.ResolvedAt}}{{end}}">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">{{if .RiskNote}}保存修改{{else}}创建风险备注{{end}}</button>
                    <a href="{{.BasePath}}/qb/risks" class="btn-secondary">取消</a>
                </div>
            </form>
        </section>
    </main>
</div>
<style>
.qb-form{display:flex;flex-direction:column;gap:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:13px;font-weight:500;color:var(--text-secondary)}
.form-input{padding:8px 12px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--surface-input);color:var(--text-primary);font-size:14px;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--accent-teal);box-shadow:0 0 0 2px rgba(13,148,136,.15)}
.form-actions{display:flex;gap:12px;padding-top:8px}
.btn-primary{padding:8px 20px;background:var(--accent-teal);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.btn-primary:hover{opacity:.9}
.btn-secondary{padding:8px 20px;background:var(--surface-card-alt);color:var(--text-primary);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn-secondary:hover{background:var(--surface-hover)}
</style>
<script>
document.getElementById('riskForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
        const resp = await fetch('{{.BasePath}}/qb/risk/save', {
            method: 'POST',
            headers: {'X-Requested-With': 'XMLHttpRequest'},
            body: new FormData(this)
        });
        const data = await resp.json();
        if (data.redirect) {
            window.location.href = data.redirect;
        } else if (data.error) {
            alert(data.error);
            btn.disabled = false;
        }
    } catch(err) {
        alert('提交失败: ' + err.message);
        btn.disabled = false;
    }
});
</script>
{{end}}
