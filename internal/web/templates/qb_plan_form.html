{{define "content"}}
<div class="app">
    <main id="main-content" class="main-content">
        <div class="welcome-banner">
            <h1 class="welcome-title">{{if .Plan}}编辑套餐{{else}}新增套餐{{end}}</h1>
        </div>
        <section class="insights-panel" style="max-width:640px">
            <form id="planForm" class="qb-form">
                {{if .Plan}}<input type="hidden" name="id" value="{{.Plan.ID}}">{{end}}
                <input type="hidden" name="platform_id" value="{{.PlatformID}}">
                <div class="form-group">
                    <label class="form-label" for="name">名称 *</label>
                    <input class="form-input" type="text" id="name" name="name" value="{{if .Plan}}{{.Plan.Name}}{{end}}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="plan_type">套餐类型 *</label>
                    <input class="form-input" type="text" id="plan_type" name="plan_type" value="{{if .Plan}}{{.Plan.PlanType}}{{end}}" placeholder="如: pro, free, enterprise" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="starts_at">开始时间</label>
                    <input class="form-input" type="text" id="starts_at" name="starts_at" value="{{if .Plan}}{{.Plan.StartsAt}}{{end}}" placeholder="2025-01-01T00:00:00Z">
                </div>
                <div class="form-group">
                    <label class="form-label" for="expires_at">到期时间</label>
                    <input class="form-input" type="text" id="expires_at" name="expires_at" value="{{if .Plan}}{{.Plan.ExpiresAt}}{{end}}" placeholder="2025-12-31T23:59:59Z">
                </div>
                <div class="form-group">
                    <label class="form-label" for="renewal_policy">续费策略</label>
                    <select class="form-input" id="renewal_policy" name="renewal_policy">
                        <option value="auto" {{if and .Plan (eq .Plan.RenewalPolicy "auto")}}selected{{end}}>自动续费</option>
                        <option value="manual" {{if and .Plan (eq .Plan.RenewalPolicy "manual")}}selected{{end}}>手动续费</option>
                        <option value="none" {{if and .Plan (eq .Plan.RenewalPolicy "none")}}selected{{end}}>不续费</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="status">状态</label>
                    <select class="form-input" id="status" name="status">
                        <option value="active" {{if and .Plan (eq .Plan.Status "active")}}selected{{end}}>活跃</option>
                        <option value="expired" {{if and .Plan (eq .Plan.Status "expired")}}selected{{end}}>已过期</option>
                        <option value="cancelled" {{if and .Plan (eq .Plan.Status "cancelled")}}selected{{end}}>已取消</option>
                        <option value="trial" {{if and .Plan (eq .Plan.Status "trial")}}selected{{end}}>试用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="priority">优先级</label>
                    <input class="form-input" type="number" id="priority" name="priority" value="{{if .Plan}}{{.Plan.Priority}}{{else}}0{{end}}" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label" for="recommended_role">推荐角色</label>
                    <input class="form-input" type="text" id="recommended_role" name="recommended_role" value="{{if .Plan}}{{.Plan.RecommendedRole}}{{end}}" placeholder="如: developer, team">
                </div>
                <div class="form-group">
                    <label class="form-label" for="risk_summary">风险摘要</label>
                    <textarea class="form-input" id="risk_summary" name="risk_summary" rows="2">{{if .Plan}}{{.Plan.RiskSummary}}{{end}}</textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">{{if .Plan}}保存修改{{else}}创建套餐{{end}}</button>
                    <a href="{{.BasePath}}/qb/plans" class="btn-secondary">取消</a>
                </div>
            </form>
        </section>
    </main>
</div>
<style>
.qb-form{display:flex;flex-direction:column;gap:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:13px;font-weight:500;color:var(--text-secondary)}
.form-input{padding:8px 12px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--surface-input);color:var(--text-primary);font-size:14px;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--accent-teal);box-shadow:0 0 0 2px rgba(13,148,136,.15)}
.form-actions{display:flex;gap:12px;padding-top:8px}
.btn-primary{padding:8px 20px;background:var(--accent-teal);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.btn-primary:hover{opacity:.9}
.btn-secondary{padding:8px 20px;background:var(--surface-card-alt);color:var(--text-primary);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn-secondary:hover{background:var(--surface-hover)}
</style>
<script>
document.getElementById('planForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
        const resp = await fetch('{{.BasePath}}/qb/plan/save', {
            method: 'POST',
            headers: {'X-Requested-With': 'XMLHttpRequest'},
            body: new FormData(this)
        });
        const data = await resp.json();
        if (data.redirect) {
            window.location.href = data.redirect;
        } else if (data.error) {
            alert(data.error);
            btn.disabled = false;
        }
    } catch(err) {
        alert('提交失败: ' + err.message);
        btn.disabled = false;
    }
});
</script>
{{end}}
