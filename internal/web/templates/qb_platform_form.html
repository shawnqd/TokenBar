{{define "content"}}
<div class="app">
    <main id="main-content" class="main-content">
        <div class="welcome-banner">
            <h1 class="welcome-title">{{if .Platform}}编辑平台{{else}}新增平台{{end}}</h1>
        </div>
        <section class="insights-panel" style="max-width:640px">
            <form id="platformForm" class="qb-form">
                {{if .Platform}}<input type="hidden" name="id" value="{{.Platform.ID}}">{{end}}
                <div class="form-group">
                    <label class="form-label" for="name">名称 *</label>
                    <input class="form-input" type="text" id="name" name="name" value="{{if .Platform}}{{.Platform.Name}}{{end}}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="vendor">厂商 *</label>
                    <input class="form-input" type="text" id="vendor" name="vendor" value="{{if .Platform}}{{.Platform.Vendor}}{{end}}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="category">类别</label>
                    <input class="form-input" type="text" id="category" name="category" value="{{if .Platform}}{{.Platform.Category}}{{end}}" placeholder="如: LLM, Embedding">
                </div>
                <div class="form-group">
                    <label class="form-label" for="base_url">Base URL</label>
                    <input class="form-input" type="text" id="base_url" name="base_url" value="{{if .Platform}}{{.Platform.BaseURL}}{{end}}" placeholder="https://api.example.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="credential_status">凭证状态</label>
                    <select class="form-input" id="credential_status" name="credential_status">
                        <option value="unknown" {{if and .Platform (eq .Platform.CredentialStatus "unknown")}}selected{{end}}>未知</option>
                        <option value="valid" {{if and .Platform (eq .Platform.CredentialStatus "valid")}}selected{{end}}>有效</option>
                        <option value="invalid" {{if and .Platform (eq .Platform.CredentialStatus "invalid")}}selected{{end}}>无效</option>
                        <option value="expired" {{if and .Platform (eq .Platform.CredentialStatus "expired")}}selected{{end}}>已过期</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="default_risk_level">默认风险等级</label>
                    <select class="form-input" id="default_risk_level" name="default_risk_level">
                        <option value="none" {{if and .Platform (eq .Platform.DefaultRiskLevel "none")}}selected{{end}}>无</option>
                        <option value="low" {{if and .Platform (eq .Platform.DefaultRiskLevel "low")}}selected{{end}}>低</option>
                        <option value="medium" {{if and .Platform (eq .Platform.DefaultRiskLevel "medium")}}selected{{end}}>中</option>
                        <option value="high" {{if and .Platform (eq .Platform.DefaultRiskLevel "high")}}selected{{end}}>高</option>
                    </select>
                </div>
                <div class="form-group form-checkbox">
                    <label>
                        <input type="checkbox" name="is_active" value="1" {{if and .Platform .Platform.IsActive}}checked{{end}}>
                        <span>启用</span>
                    </label>
                </div>
                <div class="form-group">
                    <label class="form-label" for="notes">备注</label>
                    <textarea class="form-input" id="notes" name="notes" rows="3">{{if .Platform}}{{.Platform.Notes}}{{end}}</textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">{{if .Platform}}保存修改{{else}}创建平台{{end}}</button>
                    <a href="{{.BasePath}}/qb/plans" class="btn-secondary">取消</a>
                </div>
            </form>
        </section>
    </main>
</div>
<style>
.qb-form{display:flex;flex-direction:column;gap:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:13px;font-weight:500;color:var(--text-secondary)}
.form-input{padding:8px 12px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--surface-input);color:var(--text-primary);font-size:14px;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--accent-teal);box-shadow:0 0 0 2px rgba(13,148,136,.15)}
.form-checkbox{flex-direction:row;align-items:center;gap:8px}
.form-checkbox label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.form-actions{display:flex;gap:12px;padding-top:8px}
.btn-primary{padding:8px 20px;background:var(--accent-teal);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.btn-primary:hover{opacity:.9}
.btn-secondary{padding:8px 20px;background:var(--surface-card-alt);color:var(--text-primary);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn-secondary:hover{background:var(--surface-hover)}
</style>
<script>
document.getElementById('platformForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
        const resp = await fetch('{{.BasePath}}/qb/platform/save', {
            method: 'POST',
            headers: {'X-Requested-With': 'XMLHttpRequest'},
            body: new FormData(this)
        });
        const data = await resp.json();
        if (data.redirect) {
            window.location.href = data.redirect;
        } else if (data.error) {
            alert(data.error);
            btn.disabled = false;
        }
    } catch(err) {
        alert('提交失败: ' + err.message);
        btn.disabled = false;
    }
});
</script>
{{end}}
